# Catálogo de versões: ÚNICA lista de dependências do projeto (ver CLAUDE.md).
# Nunca escreva uma versão direto num build.gradle.kts.
# Versões de AGP, Kotlin, Compose e Media3 iguais às do BoomListener (já provadas no CI).

[versions]
agp = "9.4.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 Expressive: a 1.4.0 estável ainda não tem a maioria dos componentes
# Expressive. Trocar para a 1.5.0 estável assim que sair.
material3 = "1.5.0-beta01"
materialIconsCore = "1.7.8"
activityCompose = "1.13.0"
androidxCore = "1.19.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
junit = "4.13.2"
coroutines = "1.10.2"
media3 = "1.11.1"
datastore = "1.2.1"
# Coil 3: imagens da grade e do visualizador (pedido e aprovado pelo mantenedor).
# 3.6.3 é a estável mais nova (18/09/2026, conferida no changelog oficial); exige minSdk 23.
coil = "3.6.3"
# Cofre: ZIP com criptografia AES-256 (Java puro, sem código nativo; 2.11.5 conferida no Maven Central).
zip4j = "2.11.5"
# Reordenar por arrasto (mesma versão do BoomListener): editar ferramentas dos Álbuns. Apache 2.0.
reorderable = "3.1.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }

# Usados só pelo build-logic (plugins de convenção).
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 já traz Kotlin embutido ("built-in Kotlin"), então o plugin
# kotlin-android NÃO é aplicado em nenhum módulo. Ele só é declarado na raiz
# (apply false) para fixar a versão do Kotlin usada pelo AGP e pelo Compose.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Plugins de convenção (build-logic/convention).
helix-android-application = { id = "helix.android.application" }
helix-android-library = { id = "helix.android.library" }
helix-android-compose = { id = "helix.android.compose" }
helix-android-feature = { id = "helix.android.feature" }
